version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: weather_truck_db
    environment:
      POSTGRES_DB: weather_routing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather_truck_backend
    environment:
      DJANGO_SECRET_KEY: production-django-secret-key-truck-routing-2026
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,frontend"
      DATABASE_URL: "postgres://postgres:postgrespassword@db:5432/weather_routing"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: weather_truck_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
